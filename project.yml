name: NextCaltrain
options:
  bundleIdPrefix: com.netpress
  deploymentTarget:
    iOS: "17.0"
packages:
  Quick:
    url: https://github.com/Quick/Quick.git
    from: 7.0.0
  Nimble:
    url: https://github.com/Quick/Nimble.git
    from: 13.0.0
targets:
  NextCaltrain:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: assets/Assets.xcassets
        type: asset
    resources:
      - path: assets/schedule.json
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 754T277KBJ
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NextCaltrain/Info.plist
      properties:
        CFBundleDisplayName: Next Caltrain
        UILaunchStoryboardName: ""
  NextCaltrainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NextCaltrain
      - package: Quick
      - package: Nimble
    settings:
      GENERATE_INFOPLIST_FILE: true
schemes:
  NextCaltrain:
    build:
      targets:
        NextCaltrain: all
        NextCaltrainTests: [test]
    test:
      targets:
        # Pinned explicitly (rather than relying on the implicit default) so
        # it can't be silently flipped later -- without a Test Plan, XCTest
        # already runs alphabetically by default, which is what made the
        # Kotlin sibling's *undefined* Kotest spec order the harder side to
        # fix (see next-caltrain-kotlin's ProjectConfig.kt).
        - name: NextCaltrainTests
          randomExecutionOrder: false
